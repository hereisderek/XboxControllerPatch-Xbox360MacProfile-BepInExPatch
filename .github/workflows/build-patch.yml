name: Build XboxControllerPatch

on:
  push:
    branches:
      - develop
      - main
    tags:
      - release_*
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Download BepInEx core dependencies
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_DIR="XboxControllerPatch"
          LIB_DIR="$PROJECT_DIR/lib"
          mkdir -p "$LIB_DIR"

          # Skip download if all required files already exist.
          required=("BepInEx.dll" "BepInEx.Preloader.dll" "Mono.Cecil.dll" "0Harmony.dll")
          missing=0
          for f in "${required[@]}"; do
            if [[ ! -f "$LIB_DIR/$f" ]]; then
              missing=1
            fi
          done

          if [[ "$missing" -eq 0 ]]; then
            echo "All required dependencies already present in $LIB_DIR"
            exit 0
          fi

          api_url="https://api.github.com/repos/BepInEx/BepInEx/releases/latest"
          release_json="$RUNNER_TEMP/bepinex-release.json"
          curl -fsSL "$api_url" -o "$release_json"

          # Prefer macOS/Unix packages first, then linux x64, then any BepInEx zip.
          asset_url=$(jq -r '.assets[] | select(.name | test("BepInEx_(macos|unix).*\\.zip$"; "i")) | .browser_download_url' "$release_json" | head -n 1)

          if [[ -z "$asset_url" || "$asset_url" == "null" ]]; then
            asset_url=$(jq -r '.assets[] | select(.name | test("BepInEx_linux_x64_.*\\.zip$"; "i")) | .browser_download_url' "$release_json" | head -n 1)
          fi

          if [[ -z "$asset_url" || "$asset_url" == "null" ]]; then
            asset_url=$(jq -r '.assets[] | select(.name | test("BepInEx_.*\\.zip$"; "i") and (.name | test("patcher"; "i") | not)) | .browser_download_url' "$release_json" | head -n 1)
          fi

          if [[ -z "$asset_url" || "$asset_url" == "null" ]]; then
            echo "Could not find a suitable BepInEx release asset from $api_url"
            exit 1
          fi

          echo "Downloading BepInEx asset: $asset_url"
          tmp_zip="$RUNNER_TEMP/bepinex.zip"
          extract_dir="$RUNNER_TEMP/bepinex"
          mkdir -p "$extract_dir"
          curl -fL "$asset_url" -o "$tmp_zip"
          unzip -q "$tmp_zip" -d "$extract_dir"

          core_dll=$(find "$extract_dir" -type f -path '*/BepInEx/core/BepInEx.dll' | head -n 1)
          if [[ -z "$core_dll" ]]; then
            echo "Could not locate BepInEx/core/BepInEx.dll in extracted archive"
            exit 1
          fi

          core_dir=$(dirname "$core_dll")
          cp "$core_dir/BepInEx.dll" "$LIB_DIR/"
          cp "$core_dir/BepInEx.Preloader.dll" "$LIB_DIR/"
          cp "$core_dir/Mono.Cecil.dll" "$LIB_DIR/"
          cp "$core_dir/0Harmony.dll" "$LIB_DIR/"

          echo "Downloaded and copied BepInEx core dependencies to $LIB_DIR"

      - name: Build (Release)
        run: dotnet build XboxControllerPatch/XboxControllerPatch.csproj -c Release --nologo

      - name: Package macOS patch bundle
        shell: bash
        run: |
          set -euo pipefail

          PACKAGE_NAME="MacOSXboxControllerPatch"
          PACKAGE_DIR="$RUNNER_TEMP/$PACKAGE_NAME"
          mkdir -p "$PACKAGE_DIR"

          cp "XboxControllerPatch/bin/Release/net46/MacOSXboxControllerPatch.dll" "$PACKAGE_DIR/"
          cp "INSTALL.txt" "$PACKAGE_DIR/"

          cd "$RUNNER_TEMP"
          zip -r "$PACKAGE_NAME.zip" "$PACKAGE_NAME"

      - name: Check tag commit is on main
        id: tag_on_main
        if: startsWith(github.ref, 'refs/tags/release_') || startsWith(github.ref, 'refs/tags/realease_')
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          if git branch -r --contains "$GITHUB_SHA" | grep -q 'origin/main'; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "Tag commit is on main; release publish enabled."
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "Tag commit is not on main; release publish skipped."
          fi

      - name: Publish GitHub release asset
        if: (startsWith(github.ref, 'refs/tags/release_') || startsWith(github.ref, 'refs/tags/realease_')) && steps.tag_on_main.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            ${{ runner.temp }}/MacOSXboxControllerPatch.zip

      - name: Upload packaged artifact
        uses: actions/upload-artifact@v4
        with:
          name: MacOSXboxControllerPatch
          path: |
            ${{ runner.temp }}/MacOSXboxControllerPatch.zip
          if-no-files-found: error
